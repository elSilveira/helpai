project_name: HelpAI
description: A lightweight Windows overlay application for internal quality-assurance sessions, UX evaluations, and engineering training workflows.
features:
  - name: Audio Analysis
    hotkey: Ctrl+D
    description: Records microphone/system audio, transcribes it locally, and generates QA insights via OpenAI.
  - name: Screenshot Feedback
    hotkey: Ctrl+E
    description: Captures screen, analyzes with GPT-4o vision, returns context-aware notes.
  - name: Quick Input
    hotkey: Ctrl+Shift+Enter
    description: Opens a text prompt for ad-hoc questions or note logging.
  - name: Capture-excluded overlay
    description: Uses SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE) so the overlay does not pollute screen recordings or broadcasts.
  - name: Semi-transparent draggable UI
    description: Always-on-top borderless window using Tkinter.
  - name: Settings UI
    description: Provides an interface to manage settings like API keys and devices.

stack:
  language: Python
  ui_framework: Tkinter (Built-in)
  audio: SoundCard
  image_capture: mss
  keybindings: keyboard
  ai_integration:
    - openai (GPT-4o)
    - local_transcriber (Whisper via openai API or local)
  system_integration: pywin32 (for WDA_EXCLUDEFROMCAPTURE)
  packaging: PyInstaller (via build.py)

core_files:
  main.py: Entry point, initializes the overlay, binds hotkeys, and runs the Tkinter main loop.
  overlay.py: Contains the OverlayUI class for rendering the floating interface.
  config.py: Default configuration variables (SCREAMING_SNAKE_CASE).
  settings.py: Manages loading and saving settings to settings.json.
  settings_ui.py: The GUI window for letting users change settings.
  audio_capture.py: Handles reading audio devices and capturing microphone/speaker audio.
  local_transcriber.py: Handles transcribing recorded audio to text.
  screenshot.py: Captures the screen using mss.
  analyzer.py: Contains the logic to call OpenAI APIs for generating insights from text and images.
  visibility.py: Provides platform-specific windows API calls to make the window exclude from capture.
  launcher.py: Alternative entry point or process wrapper.
  build.py: Script to run PyInstaller and package the app.

dependencies:
  - openai>=1.30.0
  - SoundCard>=0.4.3
  - numpy>=1.24.0
  - mss>=9.0.0
  - Pillow>=10.0.0
  - keyboard>=0.13.5
  - pywin32>=306

build_instructions:
  - Run `install.bat` to install dependencies and create venv.
  - Run `build.py` to package the executable via PyInstaller into `dist/HelpAI.exe`.
  - Use `run.bat` for typical development runs.
